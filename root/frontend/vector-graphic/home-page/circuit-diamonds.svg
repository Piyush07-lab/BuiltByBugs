<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="circuitGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="diamondGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="diamondGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- 45-Degree Circuit Traces and Buses -->
  <g id="circuit-traces" stroke="url(#traceGrad)" stroke-width="1.2">
    <!-- Upper Left Diagonal Bus -->
    <path d="M 0,220 L 320,540 L 580,540 L 720,680 L 860,680" />
    <path d="M 60,160 L 360,460 L 520,460" stroke-dasharray="8 4" stroke-opacity="0.6" />
    <path d="M 520,460 L 620,560 L 620,720" stroke-opacity="0.4" />

    <!-- Upper Right to Center Circuit -->
    <path d="M 1300,0 L 1480,180 L 1480,340 L 1620,480 L 1920,480" />
    <path d="M 1120,80 L 1260,220 L 1260,420 L 1420,580 L 1580,580" stroke-opacity="0.5" />
    <path d="M 1420,580 L 1420,760 L 1280,900 L 1020,900" stroke-dasharray="10 5" stroke-opacity="0.4" />

    <!-- Bottom Center Branch -->
    <path d="M 780,1080 L 920,940 L 1180,940 L 1320,1080" stroke-opacity="0.3" />
  </g>

  <!-- Technical Tick Marks and Coordinate Crosshairs -->
  <g stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1">
    <path d="M 570,535 L 570,545 M 580,535 L 580,545 M 590,535 L 590,545" />
    <path d="M 1475,330 L 1485,330 M 1475,340 L 1485,340 M 1475,350 L 1485,350" />
    <!-- Crosshair Target -->
    <circle cx="860" cy="680" r="14" fill="none" stroke-opacity="0.25" stroke-dasharray="3 3" />
    <line x1="840" y1="680" x2="880" y2="680" stroke-opacity="0.4" />
    <line x1="860" y1="660" x2="860" y2="700" stroke-opacity="0.4" />
  </g>

  <!-- Floating Rounded Diamonds & Rhombus Plates -->
  <g id="floating-diamonds">
    <!-- Diamond 1: Upper Right Large Translucent Hero Plate -->
    <g transform="translate(1540, 260) rotate(45)">
      <rect x="-85" y="-85" width="170" height="170" rx="20" fill="url(#diamondGrad1)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.35" />
      <rect x="-65" y="-65" width="130" height="130" rx="14" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4" />
    </g>

    <!-- Diamond 2: Mid Right Accent Diamond -->
    <g transform="translate(1720, 480) rotate(45)">
      <rect x="-45" y="-45" width="90" height="90" rx="12" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-opacity="0.5" />
      <rect x="-25" y="-25" width="50" height="50" rx="8" fill="url(#diamondGrad2)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />
    </g>

    <!-- Diamond 3: Lower Center Floating Tile -->
    <g transform="translate(1020, 780) rotate(45)">
      <rect x="-60" y="-60" width="120" height="120" rx="16" fill="url(#diamondGrad2)" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.3" />
    </g>

    <!-- Diamond 4: Left Mid Subtle Satellite -->
    <g transform="translate(320, 540) rotate(45)">
      <rect x="-35" y="-35" width="70" height="70" rx="10" fill="none" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="4" fill="#06B6D4" opacity="0.6" />
    </g>

    <!-- Diamond 5: Upper Left Minimal Satellite -->
    <g transform="translate(240, 200) rotate(45)">
      <rect x="-20" y="-20" width="40" height="40" rx="6" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.35" />
    </g>
  </g>

  <!-- High-Luminance Micro Terminals and Amber Accents -->
  <g filter="url(#circuitGlow)">
    <circle cx="320" cy="540" r="4" fill="#06B6D4" opacity="0.9" />
    <circle cx="580" cy="540" r="3.5" fill="#10B981" opacity="0.85" />
    <circle cx="720" cy="680" r="4" fill="#06B6D4" opacity="0.9" />
    <circle cx="860" cy="680" r="4.5" fill="#F97316" opacity="0.95" />
    <circle cx="620" cy="720" r="3" fill="#F59E0B" opacity="0.8" />
    <circle cx="1480" cy="180" r="3.5" fill="#06B6D4" opacity="0.85" />
    <circle cx="1480" cy="340" r="4" fill="#3B82F6" opacity="0.9" />
    <circle cx="1620" cy="480" r="4" fill="#10B981" opacity="0.85" />
    <circle cx="1260" cy="220" r="3" fill="#8B5CF6" opacity="0.75" />
    <circle cx="1420" cy="580" r="3.5" fill="#06B6D4" opacity="0.8" />
    <circle cx="1280" cy="900" r="3.5" fill="#F97316" opacity="0.85" />
  </g>
</svg>
