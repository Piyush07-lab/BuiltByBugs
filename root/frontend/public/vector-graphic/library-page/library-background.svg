<svg width="1920" height="2800" viewBox="0 0 1920 2800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes libOrigamiShear {
        0%, 100% {
          transform: translate3d(0, 0, 0) skewX(0deg);
        }
        50% {
          transform: translate3d(-24px, 16px, 0) skewX(-1.5deg);
        }
      }

      @keyframes libFolioSway {
        0%, 100% {
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        }
        50% {
          transform: translate3d(14px, -24px, 0) rotate(2deg) scale(1.02);
        }
      }

      @keyframes libGoldShimmer {
        0%, 100% {
          stroke-opacity: 0.7;
          filter: drop-shadow(0 0 3px rgba(212, 175, 55, 0.4));
        }
        50% {
          stroke-opacity: 1.0;
          filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.85));
        }
      }

      .anim-lib-origami {
        transform-origin: 300px 700px;
        animation: libOrigamiShear 42s ease-in-out infinite;
      }

      .anim-lib-folios {
        transform-origin: 1450px 400px;
        animation: libFolioSway 32s ease-in-out infinite;
      }

      .anim-lib-gold {
        animation: libGoldShimmer 8s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .anim-lib-origami, .anim-lib-folios, .anim-lib-gold {
          animation: none !important;
        }
      }
    </style>

    <filter id="libShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="-6" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="libGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="goldBevel1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="goldBevel2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="planeViolet1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f1138" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0c0718" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="planeEmerald1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05282c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090714" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="folioBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Tint Glows Across Page -->
  <g opacity="0.45">
    <circle cx="350" cy="400" r="380" fill="#1e102f" fill-opacity="0.3" filter="url(#libGlow)" />
    <circle cx="1500" cy="1100" r="320" fill="#0c202a" fill-opacity="0.25" filter="url(#libGlow)" />
    <circle cx="400" cy="2200" r="350" fill="#1e102f" fill-opacity="0.25" filter="url(#libGlow)" />
  </g>

  <!-- LAYER 1: Large Angled Origami Planes & Radiant Golden Bevel Cuts Across Full Page -->
  <g class="anim-lib-origami">
    <g filter="url(#libShadow)">
      <polygon points="0,0 720,0 240,1180 0,1180" fill="url(#planeViolet1)" />
      <line class="anim-lib-gold" x1="720" y1="0" x2="240" y2="1180" stroke="url(#goldBevel1)" stroke-width="2.2" />
    </g>

    <g filter="url(#libShadow)">
      <polygon points="180,0 960,0 480,940 240,1180" fill="url(#planeEmerald1)" />
      <line class="anim-lib-gold" x1="960" y1="0" x2="480" y2="940" stroke="url(#goldBevel2)" stroke-width="2.5" />
      <line x1="480" y1="940" x2="240" y2="1180" stroke="url(#goldBevel1)" stroke-width="1.8" stroke-opacity="0.7" />
    </g>

    <g filter="url(#libShadow)">
      <polygon points="240,1180 620,1640 420,2200 0,2200 0,1180" fill="url(#planeViolet1)" />
      <line class="anim-lib-gold" x1="240" y1="1180" x2="620" y2="1640" stroke="url(#goldBevel1)" stroke-width="2" />
      <line class="anim-lib-gold" x1="620" y1="1640" x2="420" y2="2200" stroke="url(#goldBevel2)" stroke-width="2.2" />
    </g>

    <g filter="url(#libShadow)" opacity="0.65">
      <polygon points="1520,0 1920,0 1920,880 1340,420" fill="url(#planeViolet1)" />
      <line class="anim-lib-gold" x1="1520" y1="0" x2="1340" y2="420" stroke="url(#goldBevel2)" stroke-width="1.8" />
    </g>
  </g>

  <!-- LAYER 2: Interlocking Knowledge Ribbons & Floating Code Folios -->
  <g class="anim-lib-folios">
    <g transform="translate(1260, 1150)" filter="url(#libShadow)">
      <path d="M 120,40 L 440,360 L 360,440 L 40,120 Z" fill="#141026" fill-opacity="0.65" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.2" />
      <path d="M 280,100 L 600,420 L 520,500 L 200,180 Z" fill="#E2E8F0" fill-opacity="0.08" stroke="#E2E8F0" stroke-opacity="0.25" stroke-width="1.5" />
      <path d="M 160,340 L 480,20 L 540,80 L 220,400 Z" fill="#1A1333" fill-opacity="0.5" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.2" />
    </g>

    <g transform="translate(1420, 220) rotate(-15) skewX(20)">
      <rect x="0" y="0" width="180" height="240" rx="8" fill="#141026" fill-opacity="0.75" stroke="url(#folioBorder)" stroke-width="1.5" />
      <line x1="24" y1="36" x2="100" y2="36" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <line x1="24" y1="56" x2="156" y2="56" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.5" />
      <line x1="24" y1="72" x2="136" y2="72" stroke="#99A4BE" stroke-width="2" stroke-linecap="round" opacity="0.35" />
      <line x1="24" y1="120" x2="80" y2="120" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <g transform="translate(1540, 1600) rotate(-8) skewX(15)" opacity="0.85">
      <rect x="0" y="0" width="140" height="190" rx="6" fill="#100C22" fill-opacity="0.65" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.2" />
      <line x1="18" y1="28" x2="70" y2="28" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
      <line x1="18" y1="44" x2="120" y2="44" stroke="#99A4BE" stroke-width="1.5" opacity="0.3" />
    </g>
  </g>
</svg>
