<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="plexusGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="plexusLineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="plexusLineGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Constellation Interconnecting Web Lines -->
  <g id="plexus-lines" stroke-width="1.2">
    <!-- Primary Cluster (Upper-Right Constellation) -->
    <line x1="1220" y1="120" x2="1360" y2="80" stroke="url(#plexusLineGrad1)" />
    <line x1="1360" y1="80" x2="1520" y2="140" stroke="url(#plexusLineGrad1)" />
    <line x1="1520" y1="140" x2="1680" y2="70" stroke="url(#plexusLineGrad1)" />
    <line x1="1360" y1="80" x2="1440" y2="240" stroke="url(#plexusLineGrad2)" />
    <line x1="1520" y1="140" x2="1440" y2="240" stroke="url(#plexusLineGrad1)" />
    <line x1="1520" y1="140" x2="1620" y2="260" stroke="url(#plexusLineGrad2)" />
    <line x1="1680" y1="70" x2="1620" y2="260" stroke="url(#plexusLineGrad1)" />
    <line x1="1680" y1="70" x2="1820" y2="180" stroke="url(#plexusLineGrad1)" />
    <line x1="1620" y1="260" x2="1820" y2="180" stroke="url(#plexusLineGrad2)" />
    <line x1="1440" y1="240" x2="1560" y2="380" stroke="url(#plexusLineGrad1)" />
    <line x1="1620" y1="260" x2="1560" y2="380" stroke="url(#plexusLineGrad2)" />
    <line x1="1620" y1="260" x2="1740" y2="420" stroke="url(#plexusLineGrad1)" />
    <line x1="1820" y1="180" x2="1740" y2="420" stroke="url(#plexusLineGrad2)" />
    <line x1="1560" y1="380" x2="1740" y2="420" stroke="url(#plexusLineGrad1)" />
    <line x1="1560" y1="380" x2="1420" y2="480" stroke="url(#plexusLineGrad2)" />
    <line x1="1740" y1="420" x2="1860" y2="520" stroke="url(#plexusLineGrad1)" />
    <line x1="1420" y1="480" x2="1600" y2="560" stroke="url(#plexusLineGrad1)" />
    <line x1="1740" y1="420" x2="1600" y2="560" stroke="url(#plexusLineGrad2)" />
    <line x1="1600" y1="560" x2="1860" y2="520" stroke="url(#plexusLineGrad2)" />

    <!-- Triangulated Secondary Bridges -->
    <line x1="1220" y1="120" x2="1440" y2="240" stroke="url(#plexusLineGrad2)" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <line x1="1360" y1="80" x2="1620" y2="260" stroke="url(#plexusLineGrad1)" stroke-opacity="0.25" />
    <line x1="1440" y1="240" x2="1740" y2="420" stroke="url(#plexusLineGrad2)" stroke-opacity="0.2" />

    <!-- Secondary Cluster (Mid-Left Ambient Plexus) -->
    <line x1="180" y1="320" x2="320" y2="260" stroke="url(#plexusLineGrad1)" stroke-opacity="0.35" />
    <line x1="320" y1="260" x2="440" y2="360" stroke="url(#plexusLineGrad2)" stroke-opacity="0.4" />
    <line x1="180" y1="320" x2="260" y2="460" stroke="url(#plexusLineGrad2)" stroke-opacity="0.3" />
    <line x1="260" y1="460" x2="440" y2="360" stroke="url(#plexusLineGrad1)" stroke-opacity="0.35" />
    <line x1="260" y1="460" x2="380" y2="540" stroke="url(#plexusLineGrad1)" stroke-opacity="0.25" />
    <line x1="440" y1="360" x2="380" y2="540" stroke="url(#plexusLineGrad2)" stroke-opacity="0.3" />
  </g>

  <!-- Luminous Constellation Nodes & Pulsar Stars -->
  <g filter="url(#plexusGlow)">
    <!-- Main Cluster Nodes -->
    <circle cx="1220" cy="120" r="3" fill="#06B6D4" opacity="0.8" />
    <circle cx="1360" cy="80" r="4" fill="#3B82F6" opacity="0.9" />
    <circle cx="1520" cy="140" r="4.5" fill="#06B6D4" opacity="0.95" />
    <circle cx="1680" cy="70" r="3.5" fill="#8B5CF6" opacity="0.85" />
    <circle cx="1440" cy="240" r="4" fill="#10B981" opacity="0.9" />
    <circle cx="1620" cy="260" r="5" fill="#06B6D4" opacity="1" />
    <circle cx="1820" cy="180" r="3.5" fill="#3B82F6" opacity="0.85" />
    <circle cx="1560" cy="380" r="4.5" fill="#8B5CF6" opacity="0.9" />
    <circle cx="1740" cy="420" r="4" fill="#10B981" opacity="0.95" />
    <circle cx="1420" cy="480" r="3.5" fill="#06B6D4" opacity="0.8" />
    <circle cx="1600" cy="560" r="4.5" fill="#06B6D4" opacity="0.9" />
    <circle cx="1860" cy="520" r="3" fill="#3B82F6" opacity="0.75" />

    <!-- Left Cluster Nodes -->
    <circle cx="180" cy="320" r="3" fill="#8B5CF6" opacity="0.75" />
    <circle cx="320" cy="260" r="3.5" fill="#06B6D4" opacity="0.85" />
    <circle cx="440" cy="360" r="4" fill="#3B82F6" opacity="0.8" />
    <circle cx="260" cy="460" r="3" fill="#06B6D4" opacity="0.7" />
    <circle cx="380" cy="540" r="3.5" fill="#10B981" opacity="0.85" />
  </g>
</svg>
