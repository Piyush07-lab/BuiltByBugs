<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="meshGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Interconnecting Data Network Lines -->
  <g stroke-width="1" opacity="0.35">
    <line x1="40" y1="50" x2="140" y2="90" stroke="#8B5CF6" />
    <line x1="140" y1="90" x2="260" y2="40" stroke="#3B82F6" />
    <line x1="260" y1="40" x2="350" y2="110" stroke="#06B6D4" />
    <line x1="140" y1="90" x2="190" y2="180" stroke="#8B5CF6" />
    <line x1="260" y1="40" x2="190" y2="180" stroke="#06B6D4" />
    <line x1="190" y1="180" x2="310" y2="230" stroke="#10B981" />
    <line x1="350" y1="110" x2="310" y2="230" stroke="#06B6D4" />
    <line x1="40" y1="50" x2="80" y2="220" stroke="#8B5CF6" />
    <line x1="80" y1="220" x2="190" y2="180" stroke="#3B82F6" />
  </g>
  <!-- Strategic Nodes with Glow -->
  <g filter="url(#meshGlow)">
    <circle cx="40" cy="50" r="3" fill="#8B5CF6" />
    <circle cx="140" cy="90" r="3.5" fill="#3B82F6" />
    <circle cx="260" cy="40" r="3.2" fill="#06B6D4" />
    <circle cx="350" cy="110" r="2.8" fill="#06B6D4" />
    <circle cx="190" cy="180" r="4" fill="#06B6D4" />
    <circle cx="80" cy="220" r="3" fill="#8B5CF6" />
    <circle cx="310" cy="230" r="3.8" fill="#10B981" />
  </g>
</svg>
