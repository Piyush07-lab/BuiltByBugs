name: Backend CI

on:
  push:
    branches: [ backend ]
    paths:
      - 'root/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ backend ]
    paths:
      - 'root/backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
    inputs:
      run_tests_only:
        description: 'Skip linter and only run tests?'
        type: boolean
        default: false
      environment:
        description: 'Select deployment environment'
        type: choice
        options:
          - staging
          - production


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Set working directory to your backend folder for all 'run' steps
    defaults:
      run:
        working-directory: root/backend

    env:
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LEETCODE_ENDPOINT_URL: ${{ secrets.LEETCODE_ENDPOINT_URL }}
      LEETCODE_PASS: ${{ secrets.LEETCODE_PASS }}
      LEETCODE_USER: ${{ secrets.LEETCODE_USER }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      WAKATIME_API_URL: ${{ secrets.WAKATIME_API_URL }}
      WAKATIME_CACHE_TTL_MS: ${{ secrets.WAKATIME_CACHE_TTL_MS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: root/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Check Code Formatting
        run: npm run format:check

      - name: Run Tests
        run: npm test
