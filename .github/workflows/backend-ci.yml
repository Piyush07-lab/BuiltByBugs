name: Backend CI

on:
  push:
    branches: [ backend ]
    paths:
      - 'root/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ backend ]
    paths:
      - 'root/backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
    inputs:
      run_tests_only:
        description: 'Skip linter and only run tests?'
        type: boolean
        default: false
      environment:
        description: 'Select deployment environment'
        type: choice
        options:
          - staging
          - production


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Set working directory to your backend folder for all 'run' steps
    defaults:
      run:
        working-directory: root/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: root/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Check Code Formatting
        run: npm run format:check

      - name: Run Tests
        run: npm test
