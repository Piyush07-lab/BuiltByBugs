name: Frontend CI

on:
  push:
    branches: [ '**' ]
    paths:
      - 'root/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ '**' ]
    paths:
      - 'root/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:
    inputs:
      run_tests_only:
        description: 'Skip linter and only run tests?'
        type: boolean
        default: false
      environment:
        description: 'Select deployment environment'
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Set working directory to the frontend folder for all 'run' steps
    defaults:
      run:
        working-directory: root/frontend

    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: root/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        if: ${{ !inputs.run_tests_only }}
        run: npm run lint

      - name: Check Code Formatting
        if: ${{ !inputs.run_tests_only }}
        run: npm run format:check

      - name: Run Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
